name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full 12-environment matrix - platform/package caching keeps re-runs cheap.
        env:
          - d1_mini_oled
          - d1_mini
          - nodemcuv2
          - heltec_wifi_kit_8
          - sonoff_basic
          - sonoff_s31
          - lolin32
          - esp32-devkitc-v4
          - lolin_s2_mini
          - esp32-s3-devkitc-1
          - seeed_xiao_esp32s3
          - seeed_xiao_esp32s3_oled
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO platforms/packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: platformio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}
        # Note: extra_scripts (platformio_version_increment) bump `version` and
        # include/Version.h on every build. CI never commits these changes -
        # the runner's checkout is discarded after the job finishes.

  native-test:
    name: native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO platforms/packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: platformio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-native-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native tests
        run: pio test -e native

  lint:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # Gating since 2026-07: findings fail the build. Suppress false positives inline with a reason.
      - name: cppcheck src/
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --std=c++17 --inline-suppr --force --error-exitcode=1 \
            --suppress=missingInclude --suppress=unusedFunction \
            -I src src

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting (src/ and test/ only)
        run: |
          find src test -name '*.h' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror
